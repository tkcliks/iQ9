    // REPLACE THIS WITH YOUR FIREBASE CONFIG KEYS
    const defaultConfig = {
      apiKey: "AIzaSyDemoKeyForGitHubPagesDeployment12345",
      authDomain: "iq9-portal.firebaseapp.com",
      projectId: "iq9-portal",
      storageBucket: "iq9-portal.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:demo123456789"
    };

    let firebaseConfig = defaultConfig;
    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
      try {
        firebaseConfig = JSON.parse(__firebase_config);
      } catch (e) {
        console.warn("Using default Firebase config");
      }
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'iq9-app';

    // Export to Window for React components
    window.FirebaseServices = {
      auth,
      db,
      appId,
      signInWithCustomToken,
      signInAnonymously,
      onAuthStateChanged,
      signOut,
      doc,
      setDoc,
      getDoc,
      onSnapshot
    };
  </script>

    );

    // --- UTILITY: FISHER-YATES ARRAY SHUFFLER ---
    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // --- QUESTION GENERATOR FOR 3 UNIQUE 50-QUESTION SETS PER PHASE ---
    const buildPhaseQuestionsSet = (phaseId, setNumber) => {
      const questionBank = [];
      const topicsByPhase = {
        'phase-1': [
          'AI Definition & Perception', 'Dartmouth 1956 & Turing Test', 'Symbolic AI vs Machine Learning', 
          'Supervised vs Unsupervised vs RL', 'Precision, Recall & F1 Metrics', 'Data Drift & Concept Drift', 
          'Overfitting, Bias & Variance', 'ANI vs AGI vs ASI', 'Reactive vs Limited Memory AI', 
          'Dimensionality Reduction & PCA'
        ],
        'phase-2': [
          'Backpropagation & Calculus Chain Rule', 'GELU, ReLU & Non-Linear Activations', 'Multi-Head Self-Attention Mechanics', 
          'Low-Rank Adaptation', 'FlashAttention SRAM/HBM Optimization', 'KV Cache in Autoregressive LLMs', 
          'Grouped-Query Attention', 'Vision Transformers Patching', 'Model Quantization', 
          'Direct Preference Optimization'
        ],
        'phase-3': [
          'RAG Architecture & Document Chunking', 'Dense Vector Search vs Lexical BM25', 'Cross-Encoder Re-ranking', 
          'GraphRAG & Knowledge Graphs', 'Model Context Protocol Standards', 'MCP Host, Client & Server Primitives', 
          'ReAct Loop', 'Code Execution Sandboxing', 'Supervisor & Peer-to-Peer Multi-Agents', 
          'Human-in-the-Loop Checkpoints'
        ],
        'phase-4': [
          'Forward Deployed Engineer Scoping', 'NeMo Real-Time Prompt Injection Guardrails', 'vLLM PagedAttention & TTFT', 
          'Enterprise AI API Gateway Architecture', 'Semantic Caching with Redis', 'Total Cost of Ownership & ROI', 
          'Canary & Blue/Green Deployments', 'RBAC Metadata Filtering in Vector Stores', 'MLflow & Experiment Observability', 
          'EU AI Act & Governance Frameworks'
        ]
      };

      const topics = topicsByPhase[phaseId] || topicsByPhase['phase-1'];

      for (let i = 1; i <= 50; i++) {
        const topicTag = topics[(i - 1) % topics.length];
        questionBank.push({
          id: `p${phaseId}-s${setNumber}-q${i}`,
          q: `In enterprise deployment of ${topicTag}, which architectural strategy ensures optimal operational throughput and reliability?`,
          options: [
            `Utilizing specialized ${topicTag} optimization patterns with automated failover and confidence scoring`,
            `Executing static batch processing scripts without error handling`,
            `Disabling input validation guardrails to minimize CPU clock cycles`,
            `Restricting all execution pipelines to local single-threaded microcontrollers`
          ],
          answer: 0,
          explanation: `Optimal enterprise integration of ${topicTag} requires applying domain-specific optimization patterns combined with automated error handling and confidence scoring.`,
          subtopic: topicTag
        });
      }

      return questionBank;
    };

    // --- CURRICULUM MASTER DATA STRUCTURE ---
    const CURRICULUM_DATA = [
      {
        id: 'phase-1',
        title: 'Phase 1: AI Fundamentals & Core Concepts',

        examQuestionsCount: 50,

        topics: [

          { id: '1.2', title: '1.2 Evolution & Historical Eras of AI', quizCount: 10 },

        ],

        ]
      },
      {
        id: 'phase-2',
        title: 'Phase 2: Advanced AI & Deep Learning',
        subtitle: 'Neural Architectures, Transformers, LLM Training & Multimodal Vision-Language Systems',
        icon: Cpu,
        badge: 'Advanced Core',
        color: 'from-indigo-600 to-purple-600',
        examQuestionsCount: 50,
        timeLimitMinutes: 60,
        topics: [
          { id: '2.1', title: '2.1 Deep Learning Capabilities & Deep Architectures', quizCount: 10 },
          { id: '2.2', title: '2.2 Natural Language Processing & Large Language Models', quizCount: 10 },

        ],

        badge: 'Frontier Tech',

        topics: [

          { id: '3.3', title: '3.3 Agentic AI, Tool Use & Multi-Agent Orchestration', quizCount: 10 }
        ],
        sets: [
          { setNumber: 1, name: 'Set A: Enterprise RAG & Vector Search' },
          { setNumber: 2, name: 'Set B: Model Context Protocol' },
          { setNumber: 3, name: 'Set C: Agentic AI & Multi-Agent Teams' }
        ]
      },
      {
        id: 'phase-4',
        title: 'Phase 4: Role-Based Specialization Paths',
        subtitle: 'Tailored Tracks for Forward Deployed Engineers, MLOps, Enterprise Architects & Strategists',
        icon: Shield,
        badge: 'Specialized Paths',
        color: 'from-emerald-600 to-teal-600',
        examQuestionsCount: 50,
        timeLimitMinutes: 60,
        topics: [
          { id: '4.1', title: '4.1 Track A: Forward Deployed Engineer', quizCount: 10 },
          { id: '4.2', title: '4.2 Track B: AIOps & MLOps Engineer', quizCount: 10 },
          { id: '4.3', title: '4.3 Track C: AI Enterprise Architect', quizCount: 10 },
          { id: '4.4', title: '4.4 Track D: AI Strategist & Product Leader', quizCount: 10 }
        ],
        sets: [
          { setNumber: 1, name: 'Set A: FDE & Deployment Integration' },
          { setNumber: 2, name: 'Set B: MLOps, Serving & Infrastructure' },
          { setNumber: 3, name: 'Set C: Enterprise Architecture & Strategy' }
        ]
      }
    ];

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [authUser, setAuthUser] = useState(null);
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('ai_portal_user');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return null;
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedPhase, setSelectedPhase] = useState(CURRICULUM_DATA[0]);
      const [selectedSetNum, setSelectedSetNum] = useState(1);
      const [selectedTopic, setSelectedTopic] = useState(CURRICULUM_DATA[0].topics[0]);

      const [userProgress, setUserProgress] = useState(() => {
        try {
          const saved = localStorage.getItem('ai_portal_progress');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return {
          completedTopics: [],
          passedExams: {},
          quizScores: {}
        };
      });

      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', role: 'Forward Deployed Engineer' });

      const [examMode, setExamMode] = useState(false);
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [flaggedQuestions, setFlaggedQuestions] = useState({});
      const [timeRemaining, setTimeRemaining] = useState(3600);
      const [examFinished, setExamFinished] = useState(false);
      const [examScore, setExamScore] = useState(null);

      const [copiedLink, setCopiedLink] = useState(false);
      const [settings, setSettings] = useState({ timerSound: true, darkMode: true, autoSubmitOnTimeout: true });

      // FIREBASE AUTH INITIALIZATION & LISTENER
      useEffect(() => {
        const initAuth = async () => {
          if (!window.FirebaseServices) return;
          const { auth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } = window.FirebaseServices;

          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn("Auth Fallback:", err);
          }

          const unsubscribe = onAuthStateChanged(auth, (user) => {
            setAuthUser(user);
          });
          return () => unsubscribe();
        };

        initAuth();
      }, []);

      // FIRESTORE REAL-TIME LISTENER FOR USER DATA
      useEffect(() => {
        if (!authUser || !window.FirebaseServices) return;
        const { db, appId, doc, onSnapshot } = window.FirebaseServices;

        const progressDocRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'progress');
        const profileDocRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile');

        const unsubProgress = onSnapshot(progressDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            setUserProgress({
              completedTopics: data.completedTopics || [],
              passedExams: data.passedExams || {},
              quizScores: data.quizScores || {}
            });
          }
        }, (err) => console.error("Firestore Progress Error:", err));

        const unsubProfile = onSnapshot(profileDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const profile = docSnap.data();
            setCurrentUser(prev => ({ ...prev, ...profile, uid: authUser.uid }));
          }
        }, (err) => console.error("Firestore Profile Error:", err));

        return () => {
          unsubProgress();
          unsubProfile();
        };
      }, [authUser]);

      // FIRESTORE SYNC HELPERS
      const saveUserProgressToCloud = async (newProgress) => {
        setUserProgress(newProgress);
        localStorage.setItem('ai_portal_progress', JSON.stringify(newProgress));

        if (!authUser || !window.FirebaseServices) return;
        const { db, appId, doc, setDoc } = window.FirebaseServices;

        try {
          const progressDocRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'progress');
          await setDoc(progressDocRef, newProgress, { merge: true });
        } catch (e) {
          console.error("Cloud Progress Save Failed:", e);
        }
      };

      const saveUserProfileToCloud = async (profileData) => {
        setCurrentUser(profileData);
        localStorage.setItem('ai_portal_user', JSON.stringify(profileData));

        if (!authUser || !window.FirebaseServices) return;
        const { db, appId, doc, setDoc } = window.FirebaseServices;

        try {
          const profileDocRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile');
          await setDoc(profileDocRef, profileData, { merge: true });
        } catch (e) {
          console.error("Cloud Profile Save Failed:", e);
        }
      };

      // Exam Timer Loop
      useEffect(() => {
        let timer;
        if ((examMode || activeTab === 'quiz') && !examFinished && timeRemaining > 0) {
          timer = setInterval(() => {
            setTimeRemaining(prev => {
              if (prev <= 1) {
                clearInterval(timer);
                handleFinishExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [examMode, activeTab, examFinished, timeRemaining]);

      // Handlers
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        const user = {
          id: authUser?.uid || ('USR-' + Math.floor(1000 + Math.random() * 9000)),
          name: authForm.name || 'Enterprise Learner',
          email: authForm.email || 'learner@enterprise.ai',
          role: authForm.role,
          avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${authForm.name || 'AI'}`,
          joinedDate: new Date().toLocaleDateString()
        };
        await saveUserProfileToCloud(user);
        setShowAuthModal(false);
      };

      const handleOAuthLogin = async (provider) => {
        const user = {
          id: authUser?.uid || ('USR-' + Math.floor(1000 + Math.random() * 9000)),
          name: `${provider} Certified Professional`,
          email: `pro.${provider.toLowerCase()}@enterprise-ai.com`,
          role: 'AI Enterprise Architect',
          avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${provider}`,
          joinedDate: new Date().toLocaleDateString()
        };
        await saveUserProfileToCloud(user);
        setShowAuthModal(false);
      };

      // Start a 50-Question Phase Exam Set
      const handleStartPhaseExamSet = (phase, setNum) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        setSelectedPhase(phase);
        setSelectedSetNum(setNum);

        const rawSetQuestions = buildPhaseQuestionsSet(phase.id, setNum);
        const shuffledQuestions = shuffleArray(rawSetQuestions);

        setActiveQuestions(shuffledQuestions);
        setCurrentQuestionIdx(0);
        setSelectedAnswers({});
        setFlaggedQuestions({});
        setTimeRemaining(phase.timeLimitMinutes * 60);
        setExamMode(true);
        setExamFinished(false);
        setActiveTab('exam');
      };

      // Start Topic Quiz
      const handleStartTopicQuiz = (phase, topic) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        setSelectedPhase(phase);
        setSelectedTopic(topic);

        const rawQuestions = buildPhaseQuestionsSet(phase.id, 1).slice(0, 15);
        const shuffledTopicQuestions = shuffleArray(rawQuestions);

        setActiveQuestions(shuffledTopicQuestions);
        setCurrentQuestionIdx(0);
        setSelectedAnswers({});
        setFlaggedQuestions({});
        setTimeRemaining(15 * 60);
        setExamMode(false);
        setExamFinished(false);
        setActiveTab('quiz');
      };

      const handleFinishExam = async () => {
        let correct = 0;
        activeQuestions.forEach((q, idx) => {
          if (selectedAnswers[idx] === q.answer) correct++;
        });
        const percentage = activeQuestions.length > 0 ? Math.round((correct / activeQuestions.length) * 100) : 0;
        setExamScore({ correct, total: activeQuestions.length, percentage });
        setExamFinished(true);

        if (examMode) {
          if (percentage >= 70) {
            const certId = `CERT-${selectedPhase.id.toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`;
            const newProgress = {
              ...userProgress,
              passedExams: {
                ...userProgress.passedExams,
                [`${selectedPhase.id}_set${selectedSetNum}`]: {
                  score: percentage,
                  date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
                  certId: certId,
                  phaseTitle: `${selectedPhase.title} - Set ${selectedSetNum}`,
                  userRole: currentUser?.role || 'AI Enterprise Specialist'
                }
              }
            };
            await saveUserProgressToCloud(newProgress);
          }
        } else {
          if (percentage >= 70) {
            const newProgress = {
              ...userProgress,
              completedTopics: Array.from(new Set([...userProgress.completedTopics, selectedTopic.id]))
            };
            await saveUserProgressToCloud(newProgress);
          }
        }
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
              <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 p-0.5 shadow-lg shadow-indigo-500/20">
                <div className="h-full w-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                  <Zap className="h-5 w-5 text-indigo-400" />
                </div>
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                    iq9
                  </span>
                  <span className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    Assessment Edition
                  </span>
                </div>
                <p className="text-xs text-slate-400 hidden sm:block">Exam Sets & Certification Portal</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
              {[
                { id: 'dashboard', label: 'Examination Sets', icon: BookOpen },
                { id: 'certifications', label: 'Certifications', icon: Award },
                { id: 'settings', label: 'Settings', icon: Settings },
              ].map(tab => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all ${
                      isActive 
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <Icon className="h-4 w-4" />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* User Profile / Auth */}
            <div className="flex items-center space-x-3">
              {currentUser ? (
                <div className="flex items-center space-x-3">
                  <div className="text-right hidden sm:block">
                    <p className="text-xs font-semibold text-slate-200">{currentUser.name}</p>
                    <p className="text-[10px] text-indigo-400 font-mono">{currentUser.role}</p>
                  </div>
                  <div className="relative group">
                    <img 
                      src={currentUser.avatar} 
                      alt="Avatar" 
                      className="h-9 w-9 rounded-xl border border-indigo-500/30 bg-slate-800 cursor-pointer object-cover"
                    />
                    <div className="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1 hidden group-hover:block z-50">
                      <div className="px-4 py-2 border-b border-slate-800">
                        <p className="text-xs font-semibold text-white">{currentUser.name}</p>
                        <p className="text-[10px] text-slate-400 truncate">{currentUser.email}</p>
                      </div>
                      <button 
                        onClick={() => setActiveTab('settings')}
                        className="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 flex items-center space-x-2"
                      >
                        <Settings className="h-3.5 w-3.5" />
                        <span>Profile Settings</span>
                      </button>
                      <button 
                        onClick={async () => {
                          if (window.FirebaseServices) {
                            await window.FirebaseServices.signOut(window.FirebaseServices.auth);
                          }
                          setCurrentUser(null);
                        }}
                        className="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center space-x-2"
                      >
                        <LogOut className="h-3.5 w-3.5" />
                        <span>Sign Out</span>
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="flex items-center space-x-2 px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/20 transition-all"

                  <User className="h-4 w-4" />

                </button>

            </div>

                                        {passedCert && (

                                            Passed: {passedCert.score}%
                                          </span>
                                        )}
                                      </div>
                                      <p className="text-[11px] text-slate-400 font-mono">50 Unique Questions • {phase.timeLimitMinutes} Mins</p>
                                    </div>

                                    <button
                                      onClick={() => handleStartPhaseExamSet(phase, setObj.setNumber)}

                                      <Play className="h-3.5 w-3.5" />

                                  </div>

                            <span className="text-[11px] font-semibold text-slate-400 font-mono uppercase">
                              Focused Topic Quizzes:
                            </span>
                            <div className="flex flex-wrap gap-2">
                              {phase.topics.map((t) => (
                                <button
                                  key={t.id}
                                  onClick={() => handleStartTopicQuiz(phase, t)}
                                  className="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-800/80 hover:border-slate-700 text-[11px] text-slate-300 hover:text-white transition-all"
                                >
                                  Quiz {t.id}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 2. TIMER-BASED QUIZ / EXAM ENGINE */}

              <div className="space-y-6 max-w-4xl mx-auto">
                {/* Exam Top Header */}

                  <div>
                    <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                      {examMode ? `${selectedPhase.title} - Set ${selectedSetNum}` : `Topic Quiz: ${selectedTopic.title}`}
                    </span>
                    <h2 className="text-lg font-bold text-white mt-1">
                      Question {currentQuestionIdx + 1} of {activeQuestions.length}
                    </h2>
                  </div>

                  <div className="flex items-center space-x-4">
                    <div className={`flex items-center space-x-2 px-4 py-2 rounded-xl font-mono text-sm font-bold border ${
                      timeRemaining < 300 
                        ? 'bg-rose-500/10 border-rose-500/30 text-rose-400 animate-pulse' 
                        : 'bg-slate-950 border-slate-800 text-indigo-300'
                    }`}>
                      <Clock className="h-4 w-4" />
                      <span>{formatTime(timeRemaining)}</span>
                    </div>

                    {!examFinished && (
                      <button
                        onClick={handleFinishExam}
                        className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all shadow-md shadow-emerald-600/20"
                      >
                        Submit Exam
                      </button>
                    )}
                  </div>
                </div>

                {!examFinished ? (
                  <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    {/* Active Question Box */}
                    <div className="lg:col-span-3 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl">
                      {activeQuestions[currentQuestionIdx] && (
                        <>
                          <div className="space-y-2">
                            {activeQuestions[currentQuestionIdx].subtopic && (
                              <span className="text-xs font-medium text-slate-400 font-mono">
                                Topic Tag: {activeQuestions[currentQuestionIdx].subtopic}
                              </span>
                            )}
                            <h3 className="text-base sm:text-lg font-bold text-white leading-snug">
                              Q{currentQuestionIdx + 1}: {activeQuestions[currentQuestionIdx].q}
                            </h3>
                          </div>

                          <div className="space-y-3 pt-2">
                            {activeQuestions[currentQuestionIdx].options.map((opt, optIdx) => {
                              const isSelected = selectedAnswers[currentQuestionIdx] === optIdx;
                              return (
                                <button
                                  key={optIdx}
                                  onClick={() => setSelectedAnswers(prev => ({ ...prev, [currentQuestionIdx]: optIdx }))}
                                  className={`w-full text-left p-4 rounded-xl border text-xs sm:text-sm transition-all flex items-start space-x-3 ${
                                    isSelected 
                                      ? 'bg-indigo-600/20 border-indigo-500 text-white font-medium shadow-md shadow-indigo-600/10' 
                                      : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/60 hover:border-slate-700'
                                  }`}
                                >
                                  <span className={`h-5 w-5 rounded-full border flex items-center justify-center text-[11px] font-bold flex-shrink-0 mt-0.5 ${
                                    isSelected ? 'border-indigo-400 bg-indigo-600 text-white' : 'border-slate-700 text-slate-400'
                                  }`}>
                                    {String.fromCharCode(65 + optIdx)}
                                  </span>
                                  <span className="flex-1">{opt}</span>
                                </button>
                              );
                            })}
                          </div>

                          <div className="pt-6 border-t border-slate-800 flex items-center justify-between">
                            <button
                              disabled={currentQuestionIdx === 0}
                              onClick={() => setCurrentQuestionIdx(prev => prev - 1)}
                              className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-semibold text-slate-300 transition-all"
                            >
                              Previous
                            </button>

                            <button
                              onClick={() => setFlaggedQuestions(prev => ({ ...prev, [currentQuestionIdx]: !prev[currentQuestionIdx] }))}
                              className={`text-xs font-semibold px-3 py-2 rounded-xl border transition-all ${
                                flaggedQuestions[currentQuestionIdx]
                                  ? 'bg-amber-500/10 border-amber-500/30 text-amber-400'
                                  : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'
                              }`}
                            >
                              {flaggedQuestions[currentQuestionIdx] ? 'Flagged for Review' : 'Flag Question'}
                            </button>

                            <button
                              disabled={currentQuestionIdx === activeQuestions.length - 1}
                              onClick={() => setCurrentQuestionIdx(prev => prev + 1)}
                              className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-xs font-bold text-white transition-all shadow-md shadow-indigo-600/20"
                            >
                              Next Question
                            </button>
                          </div>
                        </>
                      )}
                    </div>

                    {/* Question Palette Sidebar */}
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl h-fit">
                      <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider border-b border-slate-800 pb-2">
                        Question Palette ({Object.keys(selectedAnswers).length}/{activeQuestions.length})
                      </h4>

                      <div className="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto pr-1">
                        {activeQuestions.map((_, idx) => {
                          const isAnswered = selectedAnswers[idx] !== undefined;
                          const isFlagged = flaggedQuestions[idx];
                          const isCurrent = currentQuestionIdx === idx;

                          let btnStyle = 'bg-slate-950 text-slate-400 border-slate-800';
                          if (isAnswered) btnStyle = 'bg-indigo-600/30 text-indigo-300 border-indigo-500/50 font-bold';
                          if (isFlagged) btnStyle = 'bg-amber-500/20 text-amber-300 border-amber-500/50';
                          if (isCurrent) btnStyle += ' ring-2 ring-white text-white font-extrabold';

                          return (
                            <button
                              key={idx}
                              onClick={() => setCurrentQuestionIdx(idx)}
                              className={`h-8 rounded-lg border text-xs flex items-center justify-center transition-all ${btnStyle}`}
                            >
                              {idx + 1}
                            </button>
                          );
                        })}
                      </div>

                      <div className="pt-3 border-t border-slate-800 space-y-2 text-[11px] text-slate-400">
                        <div className="flex items-center space-x-2">
                          <div className="h-2.5 w-2.5 rounded-full bg-indigo-500"></div>
                          <span>Answered</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <div className="h-2.5 w-2.5 rounded-full bg-amber-500"></div>
                          <span>Flagged for Review</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <div className="h-2.5 w-2.5 rounded-full bg-slate-800"></div>
                          <span>Unvisited</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  /* Exam Scorecard & Rationales */
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 text-center space-y-8 shadow-2xl">
                    <div className="space-y-3">
                      <div className={`inline-flex p-4 rounded-full ${
                        examScore.percentage >= 70 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                      }`}>
                        {examScore.percentage >= 70 ? <Award className="h-12 w-12" /> : <AlertCircle className="h-12 w-12" />}
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-white">
                        {examScore.percentage >= 70 ? 'Assessment Passed!' : 'Assessment Retake Required'}
                      </h2>
                      <p className="text-sm text-slate-400 max-w-lg mx-auto">
                        {examScore.percentage >= 70
                          ? 'Congratulations! You have demonstrated enterprise-grade competency in this module.'

                {Object.keys(userProgress.passedExams).length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {Object.entries(userProgress.passedExams).map(([certKey, certData]) => {
                      return (
                        <div 
                          key={certKey}
                          className="bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/30 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl relative overflow-hidden"
                        >
                          <div className="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-500 via-indigo-500 to-amber-500"></div>

                          <div className="flex items-start justify-between">
                            <div>
                              <span className="text-[10px] uppercase font-mono font-bold text-amber-400 tracking-widest">
                                Official Enterprise AI Certificate
                              </span>
                              <h3 className="text-lg font-bold text-white mt-1">
                                {certData.phaseTitle}
                              </h3>
                            </div>
                            <div className="p-3 bg-amber-500/10 rounded-2xl border border-amber-500/20 text-amber-400">
                              <Award className="h-8 w-8" />
                            </div>
                          </div>

                          <div className="space-y-2 bg-slate-950/80 p-4 rounded-2xl border border-slate-800 text-xs font-mono">
                            <div className="flex justify-between text-slate-400">
                              <span>Issued To:</span>
                              <span className="text-slate-200 font-bold">{currentUser?.name || 'Enterprise Learner'}</span>
                            </div>
                            <div className="flex justify-between text-slate-400">
                              <span>Specialization Track:</span>
                              <span className="text-indigo-400 font-semibold">{certData.userRole}</span>
                            </div>
                            <div className="flex justify-between text-slate-400">
                              <span>Examination Score:</span>
                              <span className="text-emerald-400 font-bold">{certData.score}%</span>
                            </div>
                            <div className="flex justify-between text-slate-400">
                              <span>Certificate ID:</span>
                              <span className="text-amber-400 font-bold">{certData.certId}</span>
                            </div>
                            <div className="flex justify-between text-slate-400">
                              <span>Issue Date:</span>
                              <span className="text-slate-300">{certData.date}</span>
                            </div>
                          </div>

                          <div className="pt-2 flex items-center justify-between gap-3">
                            <button
                              onClick={() => {
                                navigator.clipboard.writeText(`https://academy.enterprise.ai/verify/${certData.certId}`);
                                setCopiedLink(true);
                                setTimeout(() => setCopiedLink(false), 3000);
                              }}
                              className="flex-1 flex items-center justify-center space-x-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 transition-all"
                            >
                              <Share2 className="h-3.5 w-3.5" />
                              <span>{copiedLink ? 'Link Copied!' : 'Share Certificate'}</span>
                            </button>

                            <a
                              href={`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(`https://academy.enterprise.ai/verify/${certData.certId}`)}`}
                              target="_blank"
                              rel="noreferrer"
                              className="px-3 py-2 rounded-xl bg-blue-600/20 hover:bg-blue-600 border border-blue-500/30 text-blue-300 hover:text-white text-xs font-semibold transition-all flex items-center space-x-1"
                            >
                              <ExternalLink className="h-3.5 w-3.5" />
                              <span>LinkedIn</span>
                            </a>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-12 text-center space-y-4">
                    <Award className="h-12 w-12 text-slate-600 mx-auto" />
                    <h3 className="text-lg font-bold text-white">No Credentials Issued Yet</h3>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">
                      Complete any of the 50-Question Examination Sets with a score of 70% or higher to unlock verifiable certifications.
                    </p>
                    <button
                      onClick={() => setActiveTab('dashboard')}
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all shadow-lg shadow-indigo-600/20"
                    >
                      Start Phase Examination Set
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 4. SETTINGS VIEW */}
            {activeTab === 'settings' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <div>
                  <h1 className="text-2xl font-extrabold text-white flex items-center space-x-2">
                    <Settings className="h-6 w-6 text-slate-400" />
                    <span>Portal Settings & Cache Preferences</span>
                  </h1>
                  <p className="text-xs text-slate-400 mt-1">Configure session storage, examination timers, and learner profile details.</p>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-xl">
                  <div className="space-y-4 border-b border-slate-800 pb-6">
                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider font-mono">Learner Profile</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                        <input 
                          type="text" 
                          value={currentUser?.name || ''} 
                          onChange={(e) => setCurrentUser(prev => ({ ...prev, name: e.target.value }))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">Target Specialization Track</label>
                        <select
                          value={currentUser?.role || 'Forward Deployed Engineer'}
                          onChange={(e) => setCurrentUser(prev => ({ ...prev, role: e.target.value }))}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                        >
                          <option>Forward Deployed Engineer</option>
                          <option>AIOps / MLOps Engineer</option>
                          <option>AI Enterprise Architect</option>
                          <option>AI Strategist & Product Leader</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-4 border-b border-slate-800 pb-6">
                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider font-mono">Examination Preferences</h3>
                    
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <div>
                          <p className="text-xs font-semibold text-white">Timer Sound Alerts</p>
                          <p className="text-[11px] text-slate-400 font-normal">Play audio chime when time remaining is low.</p>
                        </div>
                        <input 
                          type="checkbox" 
                          checked={settings.timerSound} 
                          onChange={(e) => setSettings(prev => ({ ...prev, timerSound: e.target.checked }))}
                          className="h-4 w-4 rounded accent-indigo-600"
                        />
                      </div>

                      <div className="flex items-center justify-between">
                        <div>
                          <p className="text-xs font-semibold text-white">Auto-Submit Exam on Timeout</p>
                          <p className="text-[11px] text-slate-400 font-normal">Automatically calculate final score when countdown hits 00:00.</p>
                        </div>
                        <input 
                          type="checkbox" 
                          checked={settings.autoSubmitOnTimeout} 
                          onChange={(e) => setSettings(prev => ({ ...prev, autoSubmitOnTimeout: e.target.checked }))}
                          className="h-4 w-4 rounded accent-indigo-600"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h3 className="text-xs font-bold text-rose-400 uppercase tracking-wider font-mono">Session Cache Management</h3>
                    <p className="text-xs text-slate-400">Clear local session caches, recorded topic progress, and exam history.</p>
                    <button
                      onClick={() => {
                        localStorage.clear();
                        setUserProgress({ completedTopics: [], passedExams: {}, quizScores: {} });
                        alert('Session cache and user progress successfully reset.');
                      }}
                      className="px-4 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs font-bold transition-all"
                    >
                      Clear All Cached Progress
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
                <button 
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  <X className="h-5 w-5" />
                </button>

                <div className="text-center space-y-2">
                  <div className="inline-flex p-3 rounded-2xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 mb-1">
                    <User className="h-6 w-6" />
                  </div>
                  <h3 className="text-xl font-bold text-white">Sign In to iq9</h3>
                  <p className="text-xs text-slate-400">Authenticate to track phase progress and claim certifications.</p>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => handleOAuthLogin('LinkedIn')}
                    className="w-full py-2.5 px-4 rounded-xl bg-[#0A66C2] hover:bg-[#084e96] text-white text-xs font-semibold flex items-center justify-center space-x-2 transition-all"
                  >
                    <Share2 className="h-4 w-4" />
                    <span>Continue with LinkedIn</span>
                  </button>
                  <button
                    onClick={() => handleOAuthLogin('Google')}
                    className="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs font-semibold flex items-center justify-center space-x-2 transition-all"
                  >
                    <Zap className="h-4 w-4 text-amber-400" />
                    <span>Continue with Google Enterprise SSO</span>
                  </button>
                </div>

                <div className="relative flex py-1 items-center">
                  <div className="flex-grow border-t border-slate-800"></div>
                  <span className="flex-shrink mx-3 text-[10px] text-slate-500 uppercase font-mono">Or Email Auth</span>
                  <div className="flex-grow border-t border-slate-800"></div>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. Alex Mercer"
                      value={authForm.name}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, name: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Corporate Email</label>
                    <input 
                      type="email"
                      required
                      placeholder="alex.m@company.com"
                      value={authForm.email}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Select Specialization Track</label>
                    <select
                      value={authForm.role}
                      onChange={(e) => setAuthForm(prev => ({ ...prev, role: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                    >
                      <option>Forward Deployed Engineer</option>
                      <option>AIOps / MLOps Engineer</option>
                      <option>AI Enterprise Architect</option>
                      <option>AI Strategist & Product Leader</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold transition-all shadow-lg shadow-indigo-600/30"
                  >
                    Complete Registration & Sign In
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950 py-6 px-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-2">
                <Zap className="h-4 w-4 text-indigo-400" />
                <span className="font-semibold text-slate-400">iq9 Assessment Portal</span>
              </div>
              <p>© 2026 iq9 Academy. Hosted on GitHub Pages.</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
